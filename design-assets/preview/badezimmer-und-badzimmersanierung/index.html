<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leistungsseite Vorschau</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"><style>body{margin:0;background:#fff;font-family:Inter,Arial,sans-serif}#main{padding:0}.post-content{margin:0}</style></head><body><main id="main"><div class="post-content"><h1>Bestehender Inhalt</h1></div></main><style id="sch-service-detail-styles">
.sch-detail{--sch-blue:#2164ad;--sch-blue-dark:#174c82;--sch-ink:#171a1f;--sch-muted:#56606b;--sch-line:#dfe6ed;--sch-soft:#f3f7fb;max-width:1280px;margin:0 auto;padding:58px 32px 76px;font-family:Inter,Arial,sans-serif;color:var(--sch-ink)}
.sch-detail *{box-sizing:border-box}.sch-detail a{color:var(--sch-blue)}
.sch-detail__hero{display:grid;grid-template-columns:minmax(330px,.88fr) minmax(0,1.12fr);align-items:stretch;background:linear-gradient(135deg,#f6f8fa 0%,#edf4fa 100%);border:1px solid #e5ebf0;border-radius:12px;overflow:hidden;box-shadow:0 18px 48px rgba(28,58,87,.08)}
.sch-detail__intro{padding:48px 46px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.sch-detail__eyebrow{margin:0 0 12px;color:var(--sch-blue);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.sch-detail h1{display:flex;align-items:flex-start;gap:16px;margin:0 0 20px!important;color:var(--sch-ink)!important;font-size:clamp(36px,3.7vw,54px)!important;line-height:1.04!important;letter-spacing:-.04em!important;overflow-wrap:anywhere}
.sch-detail__title-icon{display:inline-flex;align-items:center;justify-content:center;flex:0 0 54px;width:54px;height:54px;margin-top:4px;border-radius:50%;background:#e0effc;color:var(--sch-blue);font-size:23px;letter-spacing:0;box-shadow:0 8px 20px rgba(33,100,173,.14)}
.sch-detail__lead{margin:0;color:var(--sch-muted);font-size:20px;line-height:1.58}
.sch-detail__image,.sch-service-card__media{position:relative;overflow:hidden}
.sch-detail__image{min-height:430px;margin:0!important;background:#dbe4ec}
.sch-detail__image>img{display:block;width:100%;height:100%;min-height:430px;object-fit:cover}
.sch-detail__image:after,.sch-service-card__media:before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(7,31,55,.1) 0%,transparent 36%,rgba(7,31,55,.26) 100%)}
.sch-image-watermark{position:absolute!important;z-index:3!important;right:18px;top:17px;width:min(42%,250px)!important;height:auto!important;min-height:0!important;max-height:64px;object-fit:contain!important;object-position:right top;filter:brightness(0) invert(1);opacity:.64;pointer-events:none}
.sch-image-label{position:absolute;z-index:3;right:16px;bottom:14px;padding:5px 9px;border:1px solid rgba(255,255,255,.38);border-radius:4px;background:rgba(12,45,76,.48);color:#fff;font-size:10px;font-weight:700;line-height:1.2;letter-spacing:.11em;text-transform:uppercase;backdrop-filter:blur(3px);pointer-events:none}
.sch-detail__process{display:grid;grid-template-columns:repeat(4,1fr);margin:28px 0 42px;border:1px solid var(--sch-line);border-radius:9px;background:#fff;overflow:hidden}
.sch-detail__step{display:flex;gap:13px;align-items:center;min-height:92px;padding:20px 22px;border-right:1px solid var(--sch-line)}
.sch-detail__step:last-child{border-right:0}.sch-detail__step-number{display:flex;align-items:center;justify-content:center;flex:0 0 36px;width:36px;height:36px;border-radius:50%;background:var(--sch-blue);color:#fff;font-weight:700;font-size:14px}
.sch-detail__step strong{display:block;margin-bottom:3px;font-size:16px}.sch-detail__step span:last-child{display:block;color:var(--sch-muted);font-size:13px;line-height:1.35}
.sch-detail__body{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:54px;align-items:start}
.sch-detail__copy{max-width:780px}.sch-detail__copy h2{margin:0 0 20px!important;color:var(--sch-ink)!important;font-size:clamp(29px,3vw,42px)!important;line-height:1.12!important;letter-spacing:-.025em!important}.sch-detail__copy p{margin:0 0 18px;color:#363d45;font-size:18px;line-height:1.72}.sch-detail__benefits{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 26px;margin:28px 0 0!important;padding:0!important;list-style:none!important}.sch-detail__benefits li{position:relative;margin:0!important;padding:3px 0 3px 30px;color:#242a31;font-size:16px;line-height:1.45}.sch-detail__benefits li:before{content:"\f00c";position:absolute;left:0;top:4px;font-family:"Font Awesome 5 Free";font-weight:900;color:var(--sch-blue)}
.sch-detail__contact{position:sticky;top:24px;padding:30px;border-radius:9px;background:var(--sch-blue-dark);color:#fff;box-shadow:0 16px 34px rgba(23,76,130,.2)}
.sch-detail__contact i{width:20px;text-align:center}.sch-detail__contact h2{margin:0 0 10px!important;color:#fff!important;font-size:27px!important;line-height:1.15!important}.sch-detail__contact p{margin:0 0 22px;color:#e8f1fa;font-size:15px;line-height:1.55}.sch-detail__contact a{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:50px;margin-top:10px;border-radius:6px;text-decoration:none!important;font-weight:700}.sch-detail__contact-primary{background:#fff;color:var(--sch-blue-dark)!important}.sch-detail__contact-secondary{border:1px solid rgba(255,255,255,.6);color:#fff!important}.sch-detail__contact-meta{margin-top:19px!important;margin-bottom:0!important;color:#dbe9f6!important;font-size:12px!important;text-align:center}
.sch-service-card .sch-image-watermark{top:12px;right:12px;width:min(45%,180px)!important;max-height:42px;opacity:.68}.sch-service-card .sch-image-label{right:10px;bottom:10px;padding:4px 7px;font-size:8px}.sch-service-card__media>img:first-child{display:block;width:100%;height:100%;object-fit:cover}
@media(max-width:1050px){.sch-detail{padding:42px 26px 66px}.sch-detail__intro{padding:38px 34px}.sch-detail h1{font-size:clamp(34px,4.7vw,50px)!important}.sch-detail__image,.sch-detail__image>img{min-height:380px}.sch-detail__body{grid-template-columns:minmax(0,1fr) 310px;gap:34px}.sch-detail__step{padding:18px 16px}}
@media(max-width:900px){.sch-detail__hero{grid-template-columns:1fr}.sch-detail__intro{padding:38px 34px 34px}.sch-detail__image,.sch-detail__image>img{min-height:360px}.sch-detail__process{grid-template-columns:repeat(2,1fr)}.sch-detail__step:nth-child(2){border-right:0}.sch-detail__step:nth-child(-n+2){border-bottom:1px solid var(--sch-line)}.sch-detail__body{grid-template-columns:1fr}.sch-detail__contact{position:static}.sch-detail__benefits{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.sch-detail{padding:26px 16px 108px}.sch-detail__hero{border-radius:8px}.sch-detail__intro{padding:28px 22px 26px}.sch-detail__eyebrow{margin-bottom:9px;font-size:11px}.sch-detail h1{gap:11px;margin-bottom:14px!important;font-size:31px!important;line-height:1.08!important;letter-spacing:-.035em!important}.sch-detail__title-icon{flex-basis:42px;width:42px;height:42px;margin-top:0;font-size:18px}.sch-detail__lead{font-size:16px;line-height:1.52}.sch-detail__image,.sch-detail__image>img{min-height:230px}.sch-image-watermark{top:12px;right:12px;width:44%!important;max-height:44px}.sch-image-label{right:10px;bottom:10px;font-size:8px}.sch-detail__process{margin:18px 0 32px;grid-template-columns:1fr 1fr}.sch-detail__step{min-height:84px;padding:14px 12px;gap:10px}.sch-detail__step-number{flex-basis:30px;width:30px;height:30px;font-size:12px}.sch-detail__step strong{font-size:14px}.sch-detail__step span:last-child{font-size:11px}.sch-detail__body{gap:30px}.sch-detail__copy h2{font-size:28px!important}.sch-detail__copy p{font-size:16px;line-height:1.62}.sch-detail__benefits{grid-template-columns:1fr;gap:8px;margin-top:22px!important}.sch-detail__contact{padding:26px 22px}.sch-detail__contact h2{font-size:24px!important}}
@media(max-width:850px) and (orientation:landscape) and (max-height:520px){.sch-detail{padding-top:24px}.sch-detail__hero{grid-template-columns:.95fr 1.05fr}.sch-detail__intro{padding:24px}.sch-detail h1{font-size:29px!important}.sch-detail__lead{font-size:15px}.sch-detail__image,.sch-detail__image>img{min-height:280px}.sch-detail__process{grid-template-columns:repeat(4,1fr)}.sch-detail__step{border-bottom:0!important;min-height:78px}.sch-detail__step:nth-child(2){border-right:1px solid var(--sch-line)}}
</style>
<script data-nowprocket id="sch-service-detail-script">
(function(){
var root='https://www.schmolengruber.at/wp-content/uploads/2026/09/';
var logo='https://www.schmolengruber.at/wp-content/uploads/2023/05/schmolengruber-schriftzug@2x.png';
var services={
'/waermepumpen/':{icon:'fa-fan',image:'waermepumpe-buderus-symbolbild.webp',alt:'Symbolbild einer Buderus Luft-Wasser-Wärmepumpe',eyebrow:'Heizen und kühlen',title:'Wärmepumpen von Schmolengruber',lead:'Effiziente Wärme für Ihr Zuhause – passend zu Gebäude, Wärmebedarf und persönlichem Komfort.',heading:'Von der Auswahl bis zur fertigen Anlage',text:['Wir planen und installieren Wärmepumpenlösungen für Neubau und Sanierung. Dabei betrachten wir Gebäude, Heizflächen, Warmwasserbedarf und die gewünschte Regelung als Gesamtsystem.','Bei der Geräteauswahl setzen wir unter anderem auf Lösungen von Buderus, Solarfocus, Bösch und Stiebel Eltron. Entscheidend ist eine fachgerechte Dimensionierung und eine Installation, die dauerhaft zuverlässig arbeitet.'],benefits:['Individuell dimensioniert','Für Neubau und Sanierung','Fachgerecht installiert','Service aus einer Hand']},
'/pelletskessel/':{icon:'fa-fire',image:'pelletskessel-eta-symbolbild.webp',alt:'Symbolbild einer ETA PU PelletsUnit mit Pufferspeicher',eyebrow:'Heizen mit Holzpellets',title:'Pelletskessel von ETA und Bösch',lead:'Komfortable Wärme aus Holzpellets – sorgfältig geplant und sauber in Ihr Heizsystem eingebunden.',heading:'Pelletheizung als abgestimmtes Gesamtsystem',text:['Wir beraten, planen und installieren Pelletskessel der bewährten Hersteller ETA und Bösch. Kessel, Pufferspeicher, Lagerung, Austragung und Regelung werden auf den Wärmebedarf des Gebäudes abgestimmt.','Eine fachgerechte hydraulische Einbindung, kurze und nachvollziehbare Leitungswege sowie die richtige Dimensionierung schaffen die Grundlage für einen effizienten und zuverlässigen Betrieb.'],benefits:['ETA und Bösch','Kessel und Speicher abgestimmt','Saubere Leitungsführung','Wartung und Service']},
'/gasgeraete/':{icon:'fa-burn',image:'gasgeraet-bosch-symbolbild.webp',alt:'Symbolbild eines Bosch Gas-Brennwertgeräts',eyebrow:'Heiztechnik und Service',title:'Gasgeräte: Service und Neumontage',lead:'Zuverlässige Gas-Brennwerttechnik, fachgerechte Montage und kompetenter Service für bestehende Anlagen.',heading:'Gasheizung sicher und passend geplant',text:['Schmolengruber Installationen unterstützt Sie bei Service, Reparatur und Neumontage von Gasgeräten. Wir arbeiten unter anderem mit Geräten von Buderus, Vaillant und Junkers; weitere Marken sind auf Anfrage möglich.','Wir prüfen die vorhandene Anlage, stimmen Gerät, Warmwasserbereitung und Regelung aufeinander ab und sorgen für eine ordentliche, nachvollziehbare Installation.'],benefits:['Service und Reparatur','Neumontage','Bekannte Hersteller','Persönliche Beratung']},
'/klimaanlage-und-klimaanlagenservice/':{icon:'fa-snowflake',image:'klimaanlage-symbolbild.webp',alt:'Symbolbild einer fachgerecht montierten Klimaanlage',eyebrow:'Angenehmes Raumklima',title:'Klimaanlagen und Klimaservice',lead:'Gut temperierte Räume im Sommer – mit einer Anlage, die zu Raumgröße, Nutzung und Gebäude passt.',heading:'Komfort von der Planung bis zum Service',text:['Wir beraten Sie bei der Auswahl und Positionierung Ihrer Klimaanlage und planen Innen- und Außengerät als funktionierende Einheit. Dabei achten wir auf Luftverteilung, Schall, Kondensatführung und eine zurückhaltende Integration in den Raum.','Auch nach der Montage sind wir für Wartung und Service da, damit die Anlage hygienisch, effizient und zuverlässig arbeitet.'],benefits:['Passende Dimensionierung','Saubere Montage','Kondensat fachgerecht geführt','Wartung und Service']},
'/neubauinstallationen/':{icon:'fa-home',image:'neubauinstallationen-symbolbild.webp',alt:'Symbolbild einer Rohinstallation im Neubau',eyebrow:'Technik für den Neubau',title:'Neubauinstallationen aus einer Hand',lead:'Heizung, Wasser und Sanitär frühzeitig geplant – damit Leitungswege, Anschlüsse und Termine zusammenpassen.',heading:'Gute Planung beginnt vor dem Innenausbau',text:['Im Neubau koordinieren wir die Installationen für Heizung, Wasser und Sanitär mit Grundriss, Bauablauf und den beteiligten Gewerken. So entstehen klare Leitungswege und Anschlusspunkte, bevor Böden und Wände geschlossen werden.','Von der Rohinstallation bis zur Inbetriebnahme behalten Sie einen verlässlichen Ansprechpartner für Ihre Haustechnik.'],benefits:['Durchdachte Leitungswege','Abstimmung mit Gewerken','Heizung, Wasser und Sanitär','Begleitung bis zur Inbetriebnahme']},
'/sanierungsarbeiten/':{icon:'fa-tools',image:'sanierungsarbeiten-symbolbild.webp',alt:'Symbolbild einer fachgerechten Haustechnik-Sanierung',eyebrow:'Bestehendes modernisieren',title:'Sanierungsarbeiten mit System',lead:'Bestehende Haustechnik sinnvoll erneuern – abgestimmt auf Gebäude, Budget und die weiteren Arbeiten.',heading:'Schritt für Schritt zur modernen Installation',text:['Bei Sanierungen erfassen wir zuerst den Bestand und klären, welche Leitungen, Anschlüsse und Geräte weiterverwendet werden können. Daraus entwickeln wir eine praktikable Lösung für Heizung, Wasser oder Sanitär.','Wir stimmen die Arbeiten auf Bauablauf und Nutzung ab und achten auf saubere Übergänge zwischen Bestand und neuer Installation.'],benefits:['Bestand sorgfältig geprüft','Klare Sanierungsschritte','Saubere Übergänge','Koordinierte Umsetzung']},
'/badezimmer-und-badzimmersanierung/':{icon:'fa-bath',image:'badezimmer-symbolbild.webp',alt:'Symbolbild eines modern gestalteten Badezimmers',eyebrow:'Bad gestalten',title:'Badezimmer und Badzimmersanierung',lead:'Ein Bad, das im Alltag funktioniert und zu Ihrem Stil passt – von den Anschlüssen bis zur Ausstattung.',heading:'Funktion, Komfort und Gestaltung verbinden',text:['Wir planen neue Badezimmer und Badumbauten auf Basis der vorhandenen Anschlüsse, des verfügbaren Platzes und Ihrer Wünsche. Sanitärobjekte, Armaturen und Leitungsführung werden dabei gemeinsam gedacht.','Bei einer Sanierung koordinieren wir die Installationsarbeiten so, dass aus dem bestehenden Raum ein technisch solides und angenehm nutzbares Badezimmer wird.'],benefits:['Individuelle Badplanung','Durchdachte Anschlüsse','Barrierearme Lösungen möglich','Montage und Sanierung']},
'/kleine-reparaturen-und-installationen/':{icon:'fa-wrench',image:'reparaturen-symbolbild.webp',alt:'Symbolbild einer Installateur-Reparatur',eyebrow:'Schnelle Hilfe im Alltag',title:'Kleine Reparaturen und Installationen',lead:'Vom tropfenden Wasserhahn bis zum Gerätetausch – zuverlässig erledigt und sauber hinterlassen.',heading:'Auch kleine Arbeiten verdienen Sorgfalt',text:['Wir übernehmen Reparaturen und kleinere Installationsarbeiten an Heizung, Wasser und Sanitär. Dazu zählen etwa undichte Armaturen, defekte Bauteile oder die Montage neuer Geräte und Duschsysteme.','Wir klären den Fehler, erklären die sinnvolle Lösung und führen die Arbeit ordentlich aus. Wenn daraus ein größeres Vorhaben wird, besprechen wir die nächsten Schritte transparent mit Ihnen.'],benefits:['Fehler gezielt finden','Kleine Installationen','Saubere Ausführung','Persönliche Abstimmung']}
};
var steps=[['Beratung','Bedarf und Bestand klären'],['Planung','Lösung sauber abstimmen'],['Montage','Fachgerecht umsetzen'],['Service','Langfristig erreichbar']];
function esc(s){return String(s).replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]})}
function watermark(){return '<img class="sch-image-watermark" src="'+logo+'" alt="" aria-hidden="true"><span class="sch-image-label">Symbolbild</span>'}
function renderDetail(c){var main=document.querySelector('#main .post-content')||document.querySelector('.post-content');if(!main)return;var text=c.text.map(function(p){return '<p>'+esc(p)+'</p>'}).join('');var benefits=c.benefits.map(function(x){return '<li>'+esc(x)+'</li>'}).join('');var process=steps.map(function(s,i){return '<div class="sch-detail__step"><span class="sch-detail__step-number">'+(i+1)+'</span><span><strong>'+s[0]+'</strong><span>'+s[1]+'</span></span></div>'}).join('');main.innerHTML='<article class="sch-detail"><section class="sch-detail__hero"><div class="sch-detail__intro"><p class="sch-detail__eyebrow">'+esc(c.eyebrow)+'</p><h1><span class="sch-detail__title-icon" aria-hidden="true"><i class="fas '+c.icon+'"></i></span><span>'+esc(c.title)+'</span></h1><p class="sch-detail__lead">'+esc(c.lead)+'</p></div><figure class="sch-detail__image"><img src="'+root+c.image+'" alt="'+esc(c.alt)+'" width="1536" height="1024" fetchpriority="high">'+watermark()+'</figure></section><section class="sch-detail__process" aria-label="Unser Projektablauf">'+process+'</section><section class="sch-detail__body"><div class="sch-detail__copy"><h2>'+esc(c.heading)+'</h2>'+text+'<ul class="sch-detail__benefits">'+benefits+'</ul></div><aside class="sch-detail__contact"><h2>Ihr Projekt besprechen</h2><p>Wir beraten Sie persönlich und klären die nächsten Schritte für Ihre Installation.</p><a class="sch-detail__contact-primary" href="tel:+43228261402"><i class="fas fa-mobile-alt" aria-hidden="true"></i>02282 61402</a><a class="sch-detail__contact-secondary" href="mailto:office@schmolengruber.at"><i class="fas fa-envelope" aria-hidden="true"></i>E-Mail schreiben</a><p class="sch-detail__contact-meta">Schönkirchen-Reyersdorf und Umgebung</p></aside></section></article>'}
function updateCards(){var cards=document.querySelectorAll('.sch-service-card');cards.forEach(function(card){var a=card.querySelector('a[href]');if(!a)return;var c=services[a.pathname];if(!c)return;var media=card.querySelector('.sch-service-card__media');var img=media&&media.querySelector('img');if(!media||!img)return;img.src=root+c.image;img.removeAttribute('srcset');img.removeAttribute('sizes');img.alt=c.alt;img.loading='lazy';if(!media.querySelector('.sch-image-watermark'))media.insertAdjacentHTML('beforeend',watermark())})}
function init(){var c=services[location.pathname];if(c)renderDetail(c);if(location.pathname==='/')updateCards()}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
</body></html>
